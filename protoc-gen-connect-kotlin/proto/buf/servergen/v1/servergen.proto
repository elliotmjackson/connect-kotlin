syntax = "proto3";

package buf.servergen.v1;

import "buf/servergen/in/v1/types.proto";

option java_multiple_files = false;
option java_outer_classname = "ServerGenProto";
option java_package = "com.connectrpc.servergen.fun.v1";

message Outer {
  message Inner {
    string value = 1;
  }
}

// Service whose RPC names lower-camel-case into Kotlin keywords and into the
// name of the server handler's own dispatch method.
service KeywordService {
  // Unary RPC named after a Kotlin keyword.
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc Object(buf.servergen.in.v1.Payload) returns (Outer.Inner);
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc Fun(Outer.Inner) returns (buf.servergen.in.v1.Payload.Nested) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc In(Outer.Inner) returns (stream Outer.Inner);
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc Is(stream Outer.Inner) returns (Outer.Inner) {
    option idempotency_level = IDEMPOTENT;
  }
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc When(stream Outer.Inner) returns (stream Outer.Inner);
  // Shares its name with the handler dispatch method.
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc Handle(Outer.Inner) returns (Outer.Inner) {
    option deprecated = true;
  }
}
