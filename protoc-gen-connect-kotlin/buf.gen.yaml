version: v2
clean: true
plugins:
  - local: ./protoc-gen-connect-kotlin/build/install/protoc-gen-connect-kotlin/bin/protoc-gen-connect-kotlin
    out: build/generated/sources/bufgen
    opt:
      - generateCallbackMethods=true
      - generateCoroutineMethods=true
      - generateServerHandler=true
      # conformance/server compiles handlers without defaults.
      - generateServerHandlerDefaults=true
  - protoc_builtin: java
    protoc_path: .tmp/bin/protoc
    out: build/generated/sources/bufgen
inputs:
  - directory: protoc-gen-connect-kotlin/proto
  # Eliza, for the generated client and handler tests over InMemoryHTTPClient.
  - module: buf.build/connectrpc/eliza
