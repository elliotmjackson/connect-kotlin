# Minimum-viable server config for milestone-1.
# Declares only what the bare server skeleton supports today.
# As protocol implementations come online, expand this list.
features:
  versions:
    - HTTP_VERSION_1
    - HTTP_VERSION_2
  protocols:
    - PROTOCOL_CONNECT
    - PROTOCOL_GRPC_WEB
    - PROTOCOL_GRPC
  codecs:
    - CODEC_PROTO
  compressions:
    - COMPRESSION_IDENTITY
    - COMPRESSION_GZIP
  streamTypes:
    - STREAM_TYPE_UNARY
    - STREAM_TYPE_SERVER_STREAM
    - STREAM_TYPE_CLIENT_STREAM
    - STREAM_TYPE_HALF_DUPLEX_BIDI_STREAM
    # full-duplex bidi requires real-time streaming response headers, which
    # Ktor commits eagerly on call.respond(); buffered responses deadlock the
    # harness's interleaving client. Tracked as future work.
  supportsHalfDuplexBidiOverHttp1: true
  supportsTls: true
  supportsTlsClientCerts: true
  supportsH2c: false
  supportsMessageReceiveLimit: true
  supportsConnectGet: true
