# Capabilities of the :server-springboot adapter on Tomcat 11; Main.kt sets connectrpc.tomcat.http2-overhead-data-threshold=0.
features:
  versions:
    - HTTP_VERSION_1
    - HTTP_VERSION_2
  protocols:
    - PROTOCOL_CONNECT
    - PROTOCOL_GRPC_WEB
    - PROTOCOL_GRPC
  codecs:
    - CODEC_PROTO
    - CODEC_JSON
  compressions:
    - COMPRESSION_IDENTITY
    - COMPRESSION_GZIP
    - COMPRESSION_DEFLATE
  streamTypes:
    - STREAM_TYPE_UNARY
    - STREAM_TYPE_SERVER_STREAM
    - STREAM_TYPE_CLIENT_STREAM
    - STREAM_TYPE_HALF_DUPLEX_BIDI_STREAM
    - STREAM_TYPE_FULL_DUPLEX_BIDI_STREAM
  supportsHalfDuplexBidiOverHttp1: true
  supportsTls: true
  supportsTlsClientCerts: true
  supportsH2c: true
  supportsMessageReceiveLimit: true
  supportsConnectGet: true
