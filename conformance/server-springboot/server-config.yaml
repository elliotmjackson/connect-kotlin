# Capabilities the :server-springboot adapter currently supports.
# Real gaps still: HTTP/2 cleartext (h2c) and full-duplex bidi (Servlet
# async ReadListener/WriteListener bridge pending).
features:
  versions:
    - HTTP_VERSION_1
    - HTTP_VERSION_2
  protocols:
    - PROTOCOL_CONNECT
    - PROTOCOL_GRPC_WEB
    - PROTOCOL_GRPC
  codecs:
    - CODEC_PROTO
    - CODEC_JSON
  compressions:
    - COMPRESSION_IDENTITY
    - COMPRESSION_GZIP
  streamTypes:
    - STREAM_TYPE_UNARY
    - STREAM_TYPE_SERVER_STREAM
    - STREAM_TYPE_CLIENT_STREAM
    - STREAM_TYPE_HALF_DUPLEX_BIDI_STREAM
  supportsHalfDuplexBidiOverHttp1: true
  supportsTls: true
  supportsTlsClientCerts: true
  supportsH2c: true
  supportsMessageReceiveLimit: false
  supportsConnectGet: false
